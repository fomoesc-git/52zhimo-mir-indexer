<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.app_name }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <a class="brand" href="/">{{ settings.app_name }}</a>
      <span class="sub">mir-modeley.com 中文索引采集</span>
    </div>
    <nav>
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="/">仪表盘</a>
      <a class="{{ 'active' if active == 'resources' else '' }}" href="/resources">资源</a>
      <a class="{{ 'active' if active == 'publishers' else '' }}" href="/publishers">出版商</a>
    </nav>
  </header>

  {% if task.running %}
  <div class="notice running">正在运行：{{ task.current_kind }}。采集任务串行执行，请稍后刷新查看结果。</div>
  {% elif task.last_message %}
  <div class="notice {{ task.last_status }}">{{ task.last_kind }}：{{ task.last_message }}</div>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
