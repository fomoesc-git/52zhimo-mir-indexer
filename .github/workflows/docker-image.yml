name: Build Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fomoesc-git/52zhimo-mir-indexer:latest
            ghcr.io/fomoesc-git/52zhimo-mir-indexer:${{ github.sha }}

      - name: Build local image archive
        run: |
          docker build -t 52zhimo-mir-indexer:latest .
          mkdir -p dist
          docker save 52zhimo-mir-indexer:latest | gzip > dist/52zhimo-mir-indexer-linux-amd64.tar.gz
          ls -lh dist/52zhimo-mir-indexer-linux-amd64.tar.gz

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: 52zhimo-mir-indexer-linux-amd64
          path: dist/52zhimo-mir-indexer-linux-amd64.tar.gz
          retention-days: 30
