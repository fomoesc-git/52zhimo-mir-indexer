services:
  mir-indexer:
    build: .
    container_name: mir-indexer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      APP_NAME: 纸模资源采集索引
      DATABASE_PATH: /app/data/index.db
      REQUEST_DELAY_SECONDS: "2.5"
      REQUEST_TIMEOUT_SECONDS: "45"
      USER_AGENT: "52zhimo public index bot; contact: https://52zhimo.cn"
      DAILY_CHECK_HOUR: "3"
      DAILY_CHECK_MINUTE: "15"
    volumes:
      - ./data:/app/data
