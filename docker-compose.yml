services:
  mir-indexer:
    build: .
    container_name: mir-indexer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai
      APP_NAME: 纸模资源采集索引
      DATABASE_PATH: /app/data/index.db
      REQUEST_DELAY_SECONDS: "2.5"
      REQUEST_JITTER_SECONDS: "1.5"
      REQUEST_TIMEOUT_SECONDS: "45"
      REPAIR_BATCH_LIMIT: "200"
      USER_AGENT: "52zhimo public index bot; contact: https://52zhimo.cn"
      DAILY_CHECK_HOUR: "3"
      DAILY_CHECK_MINUTE: "15"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "admin123456"
      SECRET_KEY: "please-change-this-secret-key"
    volumes:
      - ./data:/app/data
